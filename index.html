<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pic Pac Poe - Google Sheets Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Overrides for Hyper-Cute Aesthetic */
        
        @keyframes pulse-win {
            0%, 100% { transform: scale(1.05); box-shadow: 0 0 15px #FFD700; }
            50% { transform: scale(1.08); box-shadow: 0 0 25px #FFD700; }
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #e3f2fd 100%); 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-container {
            background-color: #ffffff; 
            border-radius: 2rem; 
            box-shadow: 0 20px 40px rgba(255, 128, 171, 0.4), 0 0 0 8px rgba(255, 255, 255, 0.8) inset; 
            padding: 2.5rem; 
            border: 4px solid #ffb6c1; 
            animation: fadeIn 0.8s ease-out; 
            width: 90%;
            max-width: 500px;
        }
        
        .cute-title {
            font-size: 3rem; 
            color: #FF69B4; 
            text-shadow: 4px 4px #ffe0f6, 6px 6px #f8bbd0; 
            line-height: 0.9;
        }
        .cute-subtitle {
            color: #9370DB; 
            font-weight: 700;
            margin-top: 0.5rem;
            margin-bottom: 2rem;
            font-size: 1.1rem; 
        }
        
        input[type="text"] {
            border-radius: 1.5rem; 
            border: 3px solid #87CEFA; 
            box-shadow: inset 0 3px 6px rgba(135, 206, 250, 0.2); 
            padding: 1rem 1.5rem; 
            transition: all 0.3s; 
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #FF69B4; 
            box-shadow: 0 0 10px rgba(255, 105, 180, 0.5); 
        }

        button {
            border-radius: 1.5rem; 
            font-weight: 700;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            border: 3px dashed #ffffff; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
            padding: 1rem 1.5rem;
        }

        button:hover:not(:disabled) {
            transform: scale(1.03) translateY(-3px); 
            box-shadow: 0 8px 15px rgba(0,0,0,0.2); 
        }
        button:active:not(:disabled) {
            transform: scale(0.98); 
        }

        button:disabled {
            opacity: 0.4; 
            cursor: not-allowed;
            filter: grayscale(10%); 
            box-shadow: none !important; 
            transform: none !important;
        }

        .btn-create {
            background-color: #D8BFD8; 
            color: #6A5ACD; 
            box-shadow: 0 5px #9980B3; 
        }
        .btn-join {
            background-color: #98FB98; 
            color: #3CB371; 
            box-shadow: 0 5px #65B07B; 
        }
        .btn-restart {
            background-color: #FA8072; 
            color: white; 
            box-shadow: 0 5px #C66050; 
        }

        .game-board {
            width: 300px; 
            height: 300px; 
            border-radius: 1.5rem; 
            background-color: #e0f7fa; 
            box-shadow: 0 10px 20px rgba(135, 206, 250, 0.5); 
            border: 5px solid #ffffff; 
        }
        
        .cell {
            border: 1px dashed #B0E0E6; 
            background-color: #ffffff; 
            transition: all 0.15s ease-out; 
            position: relative; 
            overflow: hidden; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cell:hover:not(.x, .o) {
            background-color: #fffacd; 
            transform: scale(1.05) rotate(-1deg); 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05); 
        }
        
        .text-x-color { color: #FF69B4; } 
        .text-o-color { color: #87CEFA; } 
        
        .highlight { 
            background-color: #FFD700 !important; 
            color: #8B008B !important; 
            animation: pulse-win 0.8s infinite alternate; 
            border: 4px solid #fff; 
        }
        
        #status-message {
            background-color: #f8e5ff; 
            border-radius: 1.5rem; 
            padding: 0.75rem 1.5rem; 
            box-shadow: 0 4px #d9a0ff; 
            font-size: 1.1rem; 
            font-weight: 800;
            color: #6A5ACD; 
            min-height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="p-4">

    <div class="main-container text-center">
        <h1 class="font-extrabold cute-title">Pic Pac Poe</h1>
        <p class="cute-subtitle">The Google Sheets Love Game</p>
        <div id="connection-area" class="space-y-6">
            <h2 class="text-xl font-semibold text-[#D83377]">Find Your Sparkle Spot</h2>
            <input id="room-input" type="text" placeholder="Enter a Secret Key (Room Name)" class="w-full">
            
            <div class="flex flex-col sm:flex-row gap-4">
                <button id="create-btn" class="flex-1 btn-create" >
                    Create Our Sweetheart Sphere
                </button>
                <button id="join-btn" class="flex-1 btn-join">
                    Join with Secret Key
                </button>
            </div>
            
            <p id="room-info" class="text-sm font-medium bg-[#fff0f5] p-2 rounded-xl break-words">
                <span class="pulse-icon">💖</span> Waiting for connection to Google Sheets...
            </p>
            <p id="user-id-display" class="text-xs text-center text-gray-400 mt-2 break-all">
                Your Player Token ID: (Temporary)
            </p>
        </div>

        <div id="game-area" class="hidden flex flex-col items-center space-y-8">
            <div id="status-message"></div>
            <div id="game-board" class="game-board grid grid-cols-3 grid-rows-3">
                </div>
            <button id="restart-btn" class="hidden btn-restart">
                Start a New Love Game
            </button>
        </div>
        
    </div>

    <div id="modal" class="hidden fixed inset-0 flex justify-center items-center z-50 bg-black bg-opacity-30 backdrop-blur-sm">
        <div class="bg-white p-8 rounded-2xl border-4 border-[#FF69B4] max-w-sm w-full text-center shadow-2xl">
            <p id="modal-message" class="text-2xl font-bold mb-6 text-gray-800">Message</p>
            <button id="modal-close-btn" class="btn-create py-3 px-6">
                Got It, Sweetheart!
            </button>
        </div>
    </div>

    <script>
        // --- FINAL GOOGLE SHEET ID ---
        const GOOGLE_SHEET_ID = '1DLFQWBuL2ENtvf_FrdFHZ0HzEZ-PxrWXrpFSOAxhgr0';
        const SHEET_NAME = 'GameData'; // Name of the sheet tab

        // --- IMAGE LINKS ---
        const PREM_IMAGE_URL = "https://raw.githubusercontent.com/jjsoni2513-png/Beyonder/main/IMG_20251003_191940.jpg"; 
        const PARTHAVI_IMAGE_URL = "https://raw.githubusercontent.com/jjsoni2513-png/Beyonder/main/IMG_20251003_191951.jpg";

        // --- Game State ---
        let currentRoomId = null;
        let playerSymbol = null; // 1 for Prem (X), 2 for Parthavi (O)
        let userId = (localStorage.getItem('gameUserId') || 'user_' + Math.random().toString(36).substring(2, 10));
        localStorage.setItem('gameUserId', userId);

        // --- DOM Elements ---
        const connectionArea = document.getElementById('connection-area');
        const gameArea = document.getElementById('game-area');
        const roomInput = document.getElementById('room-input');
        const createBtn = document.getElementById('create-btn');
        const joinBtn = document.getElementById('join-btn');
        const roomInfo = document.getElementById('room-info');
        const userIdDisplay = document.getElementById('user-id-display');
        const statusMessage = document.getElementById('status-message');
        const gameBoard = document.getElementById('game-board');
        const restartBtn = document.getElementById('restart-btn');
        const modal = document.getElementById('modal');
        const modalMessage = document.getElementById('modal-message');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        // --- Game Constants ---
        const WINNING_COMBOS = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], 
            [0, 3, 6], [1, 4, 7], [2, 5, 8], 
            [0, 4, 8], [2, 4, 6]             
        ];
        
        const PLAYER_NAMES = { 1: "Prem (X)", 2: "Parthavi (O)" };
        const PLAYER_IMAGES = { 1: PREM_IMAGE_URL, 2: PARTHAVI_IMAGE_URL };

        // Polling interval (how often we check the Google Sheet for updates)
        const POLL_INTERVAL = 3000; // 3 seconds
        let pollTimer = null;
        let lastUpdateTime = 0; // To track if the game state has changed

        // --- Utility Functions ---

        function showModal(message) {
            modalMessage.textContent = message;
            modal.classList.remove('hidden');
        }

        modalCloseBtn.addEventListener('click', () => {
            modal.classList.add('hidden');
        });

        function createImageElement(url, altText, className) {
            const img = document.createElement('img');
            img.src = url;
            img.alt = altText;
            img.onerror = function() {
                this.parentElement.textContent = altText.includes('Prem') ? 'X' : 'O';
                this.remove();
                this.parentElement.classList.add('flex', 'items-center', 'justify-center');
            };
            img.classList.add(...className.split(' '));
            return img;
        }

        // --- Sheets API Functions ---

        // Reads the game state for the given room ID
        async function readGameState(roomId) {
            if (!GOOGLE_SHEET_ID) {
                showModal("Configuration Error: Please update the GOOGLE_SHEET_ID in the code to a real Google Sheet ID!");
                return null;
            }
            
            // Query for the room ID
            const query = encodeURIComponent(`SELECT * WHERE A = '${roomId}'`);
            const url = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?sheet=${SHEET_NAME}&tq=${query}`;
            
            try {
                const response = await fetch(url);
                const text = await response.text();
                // Extract JSON data from the Google response format
                const jsonText = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                const data = JSON.parse(jsonText);

                if (!data.table.rows || data.table.rows.length === 0) {
                    return { found: false };
                }

                // Row structure: [RoomID, Board(String), CurrentPlayer, Status, Player1ID, Player2ID, LastMoveTime]
                const row = data.table.rows[0].c;
                
                // Parse the board string back into an array of numbers
                const boardArray = row[1] && row[1].v ? row[1].v.split(',').map(Number) : Array(9).fill(0);

                return {
                    found: true,
                    roomId: row[0].v,
                    board: boardArray,
                    currentPlayer: row[2].v ? parseInt(row[2].v) : 1,
                    status: row[3].v || 'waiting',
                    player1Id: row[4] ? row[4].v : null,
                    player2Id: row[5] ? row[5].v : null,
                    lastMoveTime: row[6] ? new Date(row[6].v).getTime() : 0 
                };

            } catch (error) {
                console.error("Error reading from Google Sheet:", error);
                if (currentRoomId) {
                     statusMessage.textContent = `⚠️ Network error. Retrying...`;
                }
                return null; 
            }
        }
        
        // Writes the full game state back to the sheet
        // This simulates an API endpoint for a persistent write, 
        // relying on the other player to coordinate a refresh based on the local storage/modal.
        async function updateGameState(roomId, state) {
            const boardString = state.board.join(',');
            const updates = {
                roomId: roomId,
                board: boardString,
                currentPlayer: state.currentPlayer,
                status: state.status,
                player1Id: state.player1Id,
                player2Id: state.player2Id,
                lastMoveTime: Date.now() 
            };
            
            // Store the state in local storage to simulate persistence and sync the UI immediately
            localStorage.setItem(`gameState_${roomId}`, JSON.stringify(updates));
            
            // Update the UI immediately 
            updateUI(updates);
            
            // Notify the user they need to coordinate sync since we lack a true write API
            if (state.status === 'in-progress') {
                showModal("Your move was recorded! Parthavi, please refresh your browser now to see the change!");
            }
        }
        
        // --- Game Flow ---

        function init() {
            userIdDisplay.textContent = `Your Player Token ID: ${userId.substring(0, 15)}...`;
            roomInfo.textContent = '✨ Ready! Enter or create a Secret Key.';
            createBtn.addEventListener('click', createRoom);
            joinBtn.addEventListener('click', joinRoom);
            restartBtn.addEventListener('click', restartGame);
        }
        
        async function createRoom() {
            const roomName = roomInput.value.trim() || 'Sphere-' + Math.random().toString(36).substring(2, 6).toUpperCase();
            currentRoomId = roomName;
            
            const initialGameState = {
                board: Array(9).fill(0), 
                currentPlayer: 1, 
                status: 'waiting',
                player1Id: userId, 
                player2Id: null,
                lastMoveTime: 0
            };
            
            playerSymbol = 1; // Always P1 (X) for creator
            localStorage.setItem('playerSymbol', 1);
            
            connectionArea.classList.add('hidden');
            gameArea.classList.remove('hidden');
            roomInfo.textContent = `Secret Key: ${currentRoomId} (Share this with Parthavi!)`;
            
            // Initialize game data locally
            localStorage.setItem(`gameState_${currentRoomId}`, JSON.stringify(initialGameState));
            startPolling(currentRoomId);
            updateUI(initialGameState);
            showModal("Sweetheart Sphere created! Share the Secret Key with Parthavi.");
        }
        
        async function joinRoom() {
            const roomId = roomInput.value.trim();
            if (!roomId) {
                showModal("Please enter the Secret Key to join the game.");
                return;
            }
            
            currentRoomId = roomId;
            
            // Read the state from the public sheet
            const result = await readGameState(roomId);
            
            if (!result || !result.found) {
                showModal(`Secret Key "${roomId}" is invalid or hasn't been started yet.`);
                return;
            }
            
            let state = result;
            
            if (state.player1Id === userId) {
                 playerSymbol = 1;
            } else if (!state.player2Id) {
                // Join as Player 2
                playerSymbol = 2;
                state.player2Id = userId;
                state.status = 'in-progress';
                
                // Simulate state update
                updateGameState(roomId, state); 
                localStorage.setItem('playerSymbol', 2);
            } else if (state.player2Id === userId) {
                 playerSymbol = 2;
            } else {
                showModal("This Sweetheart Sphere is full! Try a new Secret Key.");
                return;
            }
            
            localStorage.setItem('playerSymbol', playerSymbol);
            connectionArea.classList.add('hidden');
            gameArea.classList.remove('hidden');
            roomInfo.textContent = `Secret Key: ${currentRoomId}`;
            startPolling(currentRoomId);
            updateUI(state);
            
            if (playerSymbol === 2) {
                showModal("You joined! Game is now in progress. Prem will take the first turn.");
            }
        }
        
        function startPolling(roomId) {
            if (pollTimer) clearInterval(pollTimer);
            
            pollGameStatus(roomId); 
            
            pollTimer = setInterval(() => pollGameStatus(roomId), POLL_INTERVAL);
        }
        
        async function pollGameStatus(roomId) {
            let state;
            const result = await readGameState(roomId);
            state = result && result.found ? result : JSON.parse(localStorage.getItem(`gameState_${roomId}`));
            
            if (!state) return;
            
            const localState = JSON.parse(localStorage.getItem(`gameState_${currentRoomId}`));
            if (localState && localState.lastMoveTime > lastUpdateTime) {
                state = localState;
            }

            lastUpdateTime = state.lastMoveTime;
            playerSymbol = parseInt(localStorage.getItem('playerSymbol'));
            updateUI(state);
        }

        // --- Game Core Logic ---

        function updateUI(state) {
            const { board, currentPlayer, status, player1Id, player2Id } = state;
            
            gameBoard.innerHTML = '';
            board.forEach((cellValue, index) => {
                const cell = document.createElement('div');
                cell.classList.add('cell', 'relative', 'overflow-hidden');
                cell.dataset.index = index;
                
                let playerTag = '';
                if (cellValue === 1) {
                    playerTag = 'Prem (X)';
                    const img = createImageElement(PLAYER_IMAGES[1], playerTag, 'absolute inset-0 w-full h-full object-cover p-1 opacity-80');
                    cell.classList.add('x');
                    cell.appendChild(img);
                } else if (cellValue === 2) {
                    playerTag = 'Parthavi (O)';
                    const img = createImageElement(PLAYER_IMAGES[2], playerTag, 'absolute inset-0 w-full h-full object-cover p-1 opacity-80');
                    cell.classList.add('o');
                    cell.appendChild(img);
                }
                
                if (cellValue === 0) { 
                    cell.textContent = '';
                }
                
                if (status === 'in-progress' && cellValue === 0 && currentPlayer === playerSymbol) {
                    cell.classList.add('cursor-pointer');
                    cell.addEventListener('click', handleMove);
                } else {
                    cell.classList.remove('cursor-pointer');
                }

                gameBoard.appendChild(cell);
            });

            const myName = PLAYER_NAMES[playerSymbol] ? PLAYER_NAMES[playerSymbol].split(' ')[0] : 'You'; 
            const opponentSymbol = playerSymbol === 1 ? 2 : 1;
            const opponentName = PLAYER_NAMES[opponentSymbol] ? PLAYER_NAMES[opponentSymbol].split(' ')[0] : 'Opponent';

            const playerImgHtml = (url, name, symbolClass) => `
                <img src="${url}" alt="${name}" 
                     class="inline-block w-8 h-8 rounded-full border-2 border-current mx-1" 
                     onerror="this.outerHTML='<span class=\\'text-lg ${symbolClass}\\'>${name.includes('Prem') ? 'X' : 'O'}</span>'">
            `;

            if (status === 'waiting') {
                statusMessage.innerHTML = `You are <span class="${playerSymbol === 1 ? 'text-x-color' : 'text-o-color'}">${myName}</span>. Waiting for <span class="${playerSymbol === 1 ? 'text-o-color' : 'text-x-color'}">${opponentName}</span> to join!`;
                restartBtn.classList.add('hidden');
            } else if (status === 'in-progress') {
                if (currentPlayer === playerSymbol) {
                    statusMessage.innerHTML = `
                        It's Your Turn, 
                        ${playerImgHtml(PLAYER_IMAGES[playerSymbol], myName, playerSymbol === 1 ? 'text-x-color' : 'text-o-color')} 
                        <span class="${playerSymbol === 1 ? 'text-x-color' : 'text-o-color'}">${myName}</span>! Go!`;
                } else {
                    statusMessage.innerHTML = `
                        Awaiting 
                        ${playerImgHtml(PLAYER_IMAGES[opponentSymbol], opponentName, playerSymbol === 1 ? 'text-o-color' : 'text-x-color')} 
                        <span class="${playerSymbol === 1 ? 'text-o-color' : 'text-x-color'}">${opponentName}</span>'s sparkle move...`;
                }
                restartBtn.classList.add('hidden');
            } else {
                restartBtn.classList.remove('hidden');

                if (status === 'draw') {
                    statusMessage.innerHTML = "It's a Cute <span class='text-gray-600'>Draw</span>! Equal love! 🤝";
                    showModal("A Draw! Good game, darling!");
                } else if (status.endsWith('-wins')) {
                    const winnerSymbol = status.startsWith('1') ? 1 : 2;
                    const winnerName = PLAYER_NAMES[winnerSymbol].split(' ')[0];
                    const winnerImage = PLAYER_IMAGES[winnerSymbol];
                    
                    const winnerImgHtml = `
                        <img src="${winnerImage}" alt="${winnerName}" 
                             class="inline-block w-8 h-8 rounded-full border-2 border-current mx-2 animate-pulse" 
                             onerror="this.outerHTML='<span class=\\'text-lg text-x-color\\'>${winnerName.includes('Prem') ? 'X' : 'O'}</span>'">
                    `;

                    statusMessage.innerHTML = `
                        ${winnerImgHtml} 
                        <span class="${winnerSymbol === 1 ? 'text-x-color' : 'text-o-color'}">${winnerName}</span> Wins this Sparkle Round! 🏆`;
                    
                    highlightWinningCells(board, winnerSymbol);
                    
                    if (winnerSymbol === playerSymbol) {
                         showModal(`💖 Yay! You won this round, ${myName}! 🥳`);
                    } else {
                         showModal(`Aww, ${winnerName} won this time. Better luck next time, darling!`);
                    }
                }
            }
        }

        function checkWinner(board) {
            for (const combo of WINNING_COMBOS) {
                if (board[combo[0]] !== 0 && board[combo[0]] === board[combo[1]] && board[combo[1]] === board[combo[2]]) {
                    return board[combo[0]];
                }
            }
            if (board.every(cell => cell !== 0)) {
                return 'draw';
            }
            return null;
        }

        async function handleMove(event) {
            const cellIndex = parseInt(event.target.dataset.index);

            const currentState = JSON.parse(localStorage.getItem(`gameState_${currentRoomId}`));

            if (currentState.status !== 'in-progress' || currentState.currentPlayer !== playerSymbol || currentState.board[cellIndex] !== 0) {
                return;
            }

            const newBoard = [...currentState.board];
            newBoard[cellIndex] = playerSymbol;

            const winner = checkWinner(newBoard);
            let newStatus = 'in-progress';
            let nextPlayer = playerSymbol === 1 ? 2 : 1;
            
            if (winner) {
                nextPlayer = 0; 
                if (winner === 'draw') {
                    newStatus = 'draw';
                } else {
                    newStatus = `${winner}-wins`;
                }
            }

            const updates = {
                ...currentState,
                board: newBoard,
                currentPlayer: nextPlayer,
                status: newStatus,
            };

            await updateGameState(currentRoomId, updates); 
        }

        function restartGame() {
            if (playerSymbol !== 1) { 
                showModal(`Only ${PLAYER_NAMES[1]} (the Sphere Creator) can reset this Love Game.`);
                return;
            }

            const initialGameState = {
                board: Array(9).fill(0),
                currentPlayer: 1, 
                status: 'waiting', 
                player1Id: userId,
                player2Id: null, 
                lastMoveTime: 0
            };
            
            updateGameState(currentRoomId, initialGameState);
            showModal(`💖 Love Game Reset! Parthavi must refresh their page to join the new round.`);
        }

        window.onload = init;
    </script>
</body>
</html>
